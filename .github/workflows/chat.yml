# The chat's build, plan and apply are companygraph/chat-server's own, called by the release
# chat/package.json pins, and they are its Azure ones: the image goes to the bootstrap's registry
# and the Terraform applies as the identities the bootstrap made. This deployment's values reach
# them from chat/chat.json and the subscription's from deployment.json. Its own concurrency
# group, beside deploy's.
name: chat
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: chat-${{ github.ref }}
  cancel-in-progress: false
jobs:
  chat:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: companygraph/chat-server/.github/workflows/deploy-azure.yml@v0.40.1
    secrets: inherit
